{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SmartHR</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/smarthr.css' %}" rel="stylesheet">
</head>
<body>
<main class="login-shell">
  <div class="login-card">
    <div class="text-center mb-4">
      <span class="sh-logo mx-auto mb-2" style="width:48px;height:48px;font-size:1.3rem">S</span>
      <h1 class="mb-0">SmartHR</h1>
      <p class="text-muted mb-0">Smarter workforce management.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger" role="alert" style="border-radius:14px">Incorrect username or password, or the account is inactive.</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username (employee ID)</label>
        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
