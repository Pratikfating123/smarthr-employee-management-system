{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>{{ title }}</h1>{% if intro %}<p>{{ intro }}</p>{% endif %}</div>
</div>
<div class="panel" style="max-width: 860px">
  <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary loading-btn">{{ submit_label|default:"Save" }}</button>
      <a class="btn btn-light" href="{% if cancel_args %}{% url cancel_url cancel_args.0 %}{% else %}{% url cancel_url %}{% endif %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
