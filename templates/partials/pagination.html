{% if page_obj.has_other_pages %}
<nav aria-label="Pagination" class="mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
  <span class="text-muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  <ul class="pagination mb-0">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Previous page">&laquo;</a></li>
    {% endif %}
    <li class="page-item active"><span class="page-link">{{ page_obj.number }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Next page">&raquo;</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
